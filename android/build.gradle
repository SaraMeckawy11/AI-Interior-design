// Top-level build file for Livinai

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.0.21'
        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Deliberately version-less. Versions come from Expo's version catalog (see
        // expoAutolinking.useExpoVersionCatalog() in settings.gradle), so they must not be
        // pinned here.
        //
        // These used to be pinned to AGP 8.1.0, Kotlin 1.9.10 and react-native-gradle-plugin
        // 0.72.0 — all left over from an older React Native. None of them were what the build
        // actually used: settings.gradle includes @react-native/gradle-plugin and Expo's gradle
        // plugins as composite builds, those carry AGP 8.8.2 and Kotlin 2.0.21 (react-native
        // 0.79.6 / Expo SDK 53), and Gradle's highest-version-wins conflict resolution quietly
        // dropped the pins here on the floor.
        //
        // The stale numbers mattered anyway: AGP 8.1 predates compileSdk 36, so anyone reading
        // this file would conclude the Android 16 target could not build. Letting the composite
        // builds name the versions keeps the file honest and keeps the toolchain in step with
        // whatever react-native the package.json resolves to.
        classpath("com.android.tools.build:gradle")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

// Apply Expo and React Native root project plugins
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
